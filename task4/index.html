<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live Weather Dashboard built for Thiranex Web Development Internship Task 4.">
    <title>Sathwik Pinna | Task 4 - Weather Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .weather-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #weather-result {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .weather-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
        }

        .temp {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0.5rem 0;
        }

        .details {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .error-message {
            color: #ef4444;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <h2>Live Weather Dashboard</h2>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>

        <div id="weather-result">
            <p style="opacity: 0.6; margin: 0;">Search for a city to view current weather.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
