<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Task Manager application built for Thiranex Web Development Internship Task 3.">
    <title>Sathwik Pinna | Task 3 - Task Manager</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .todo-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        #todo-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--primary-color);
        }

        #todo-form button {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #todo-form button:hover {
            background-color: var(--primary-hover);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        #todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-text {
            cursor: pointer;
            flex: 1;
            word-break: break-word;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
        }

        .toggle-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.35rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.35rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .empty-message {
            text-align: center;
            opacity: 0.5;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>JavaScript Task Manager</h2>
        
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit">Add</button>
        </form>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
